backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "img"

collections:
  - name: "menu"
    label: "Speisekarte (alt, einzelner Standort)"
    files:
      - name: "menu"
        label: "Menü-Daten"
        file: "content/menu.json"
        fields: &menuFields
          - label: "Marke"
            name: "brand"
            widget: object
            fields:
              - { label: "Logo", name: "logo", widget: image }
              - { label: "Tagline", name: "tagline", widget: list, field: { label: "Wort", name: "word", widget: string } }
              - { label: "Badge-Text (Zeilenumbruch mit \\n)", name: "badge", widget: text }

          - label: "Seite 1"
            name: "seite1"
            widget: object
            fields:
              - label: "Karten"
                name: "cards"
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: "Titel", name: "title", widget: string }
                  - { label: "Titel-Bild (optional, ersetzt Text)", name: "titleImage", widget: image, required: false }
                  - { label: "Untertitel", name: "subtitle", widget: string, required: false }
                  - { label: "Handschrift-Notiz (Zeilenumbruch mit \\n)", name: "note", widget: string, required: false }
                  - { label: "Produktfoto (optional, wenn noch keins vorliegt leer lassen)", name: "image", widget: image, required: false }
                  - { label: "Spaltentitel (z.B. Größe)", name: "head", widget: string, required: false }
                  - label: "Preiszeilen (Döner/Dürüm/Rollo-Stil)"
                    name: "rows"
                    widget: list
                    required: false
                    summary: "{{label}} – {{sub}}"
                    fields:
                      - { label: "Größe (M/L/XL)", name: "label", widget: string }
                      - { label: "Gewicht", name: "sub", widget: string, required: false }
                      - { label: "Preis Hähnchen", name: "haehnchen", widget: string }
                      - { label: "Preis Steak", name: "steak", widget: string }
                      - { label: "Preis Fleisch-Mix", name: "mix", widget: string }
                  - { label: "Portionshinweis (Box)", name: "portion", widget: string, required: false }
                  - label: "Preis-Kacheln (z.B. Box, Türkische Pizza)"
                    name: "tiles"
                    widget: list
                    required: false
                    summary: "{{label}} – {{price}}"
                    fields:
                      - { label: "Bezeichnung", name: "label", widget: string }
                      - { label: "Preis", name: "price", widget: string }
                      - { label: "Ist Fleisch-Mix? (alte Box-Kacheln)", name: "mix", widget: boolean, required: false, default: false }
                      - { label: "Farbe (optional, überschreibt Fleisch-Mix)", name: "kind", widget: select, required: false, options: ["haehnchen", "steak", "is-mix", "salad", "plain"] }
                  - label: "Positionen (einfache Liste ohne Größen/Foto, z.B. Lahmacun)"
                    name: "list"
                    widget: list
                    required: false
                    summary: "{{name}} – {{price}}"
                    fields:
                      - { label: "Name", name: "name", widget: string }
                      - { label: "Preis", name: "price", widget: string }
              - label: "Menü-Balken (Spar-Angebot)"
                name: "menu"
                widget: object
                required: false
                fields:
                  - { label: "Titel", name: "title", widget: string }
                  - { label: "Text", name: "text", widget: text }
                  - label: "Angebote"
                    name: "offers"
                    widget: list
                    summary: "{{label}} – {{price}}"
                    fields:
                      - { label: "Icon", name: "icon", widget: select, options: ["cola", "ayran"] }
                      - { label: "Label", name: "label", widget: string }
                      - { label: "Preis", name: "price", widget: string }
              - { label: "Fußzeile", name: "foot", widget: list, field: { label: "Zeile", name: "line", widget: string } }

          - label: "Seite 2"
            name: "seite2"
            widget: object
            fields:
              - label: "Karten"
                name: "cards"
                widget: list
                summary: "{{title}}"
                fields:
                  - { label: "Titel", name: "title", widget: string }
                  - { label: "Untertitel", name: "subtitle", widget: string, required: false }
                  - label: "Positionen (einfache Liste)"
                    name: "list"
                    widget: list
                    required: false
                    summary: "{{name}} – {{price}}"
                    fields:
                      - { label: "Name", name: "name", widget: string }
                      - { label: "Preis", name: "price", widget: string }
                      - { label: "Mini-Bild (optional, links vom Namen)", name: "image", widget: image, required: false }
                  - label: "Preis-Kacheln (statt Liste, z.B. Pizza)"
                    name: "tiles"
                    widget: list
                    required: false
                    summary: "{{label}} – {{price}}"
                    fields:
                      - { label: "Bezeichnung", name: "label", widget: string }
                      - { label: "Preis", name: "price", widget: string }
                      - { label: "Ist Fleisch-Mix? (alte Box-Kacheln)", name: "mix", widget: boolean, required: false, default: false }
                      - { label: "Farbe", name: "kind", widget: select, required: false, options: ["haehnchen", "steak", "is-mix", "salad", "plain"] }
                  - label: "Produkt-Raster mit Bildern (statt Liste, z.B. Falafel & Halloumi, Pizzen)"
                    name: "gallery"
                    widget: list
                    required: false
                    summary: "{{name}} – {{price}}"
                    fields:
                      - { label: "Name", name: "name", widget: string }
                      - { label: "Preis", name: "price", widget: string }
                      - { label: "Bild (über dem Namen, freigestellt am besten)", name: "image", widget: image, required: false }
                      - { label: "Farbe (optional)", name: "kind", widget: select, required: false, options: ["haehnchen", "steak", "is-mix", "salad", "plain"] }
              - label: "Zusatzstoffe & Allergene (eigene Kachel unten auf Seite 2)"
                name: "info"
                widget: object
                required: false
                fields:
                  - { label: "Titel der Kachel", name: "title", widget: string, required: false }
                  - label: "Zusatzstoffe (nummeriert)"
                    name: "additives"
                    widget: list
                    required: false
                    summary: "{{n}} – {{text}}"
                    fields:
                      - { label: "Nummer", name: "n", widget: string }
                      - { label: "Text", name: "text", widget: string }
                  - label: "Allergene (Buchstaben a–n)"
                    name: "allergens"
                    widget: list
                    required: false
                    summary: "{{n}} – {{text}}"
                    fields:
                      - { label: "Buchstabe", name: "n", widget: string }
                      - { label: "Text", name: "text", widget: string }
              - { label: "Fußzeile", name: "foot", widget: list, field: { label: "Zeile", name: "line", widget: string } }

  - name: "findorff"
    label: "Speisekarte – Findorff"
    files:
      - name: "findorff"
        label: "Menü-Daten Findorff"
        file: "content/findorff.json"
        fields: *menuFields

  - name: "stuhr"
    label: "Speisekarte – Marktkauf Stuhr"
    files:
      - name: "stuhr"
        label: "Menü-Daten Stuhr"
        file: "content/stuhr.json"
        fields: *menuFields
